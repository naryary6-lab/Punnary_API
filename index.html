<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoMore Snack Store - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍌 ម៉ូម័រ MoMore Snack Store</h1>
    <p>ដំណាប់ចេកណាំវ៉ាខ្មែរ & ចេកបំពងស្រួយ</p>
  </header>

  <div class="section-title">🍌 ក្រុមដំណាប់ចេក (៩ មុខ)</div>
  <div class="grid" id="dried-bananas"></div>

  <div class="section-title">🍿 ក្រុមចេកបំពងស្រួយ (៥ មុខ)</div>
  <div class="grid" id="crispy-bananas"></div>

  <div class="bottom-bar">
    <div class="cart-summary">
      សរុប៖ <span id="cart-total" style="color: var(--accent-color); font-weight: bold;">0៛</span>
    </div>
    <button class="btn-chat" onclick="openChat()">💬 ឆាតសួរ / កុម្ម៉ង់ទិញ AI</button>
  </div>

  <!-- Chat Drawer / Modal -->
  <div class="chat-modal" id="chatModal">
    <div class="chat-header">
      <h3>🤖 ជំនួយការ AI ម៉ូម័រ</h3>
      <button onclick="closeChat()" class="btn-close">✕</button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="msg ai">សួស្តីបង! ខ្ញុំជា AI ជំនួយការលក់នៅហាង ម៉ូម័រ MoMore Snack Store។ តើបងចង់សួរព័ត៌មាន ឬកុម្ម៉ង់ទិញមុខណាដែរ?</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="userInput" placeholder="វាយសារនៅទីនេះ..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">ផ្ញើ</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
