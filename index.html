<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOMORE Retail Mini App</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;800;900&family=Moulpali&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #FFFDF7;
      --card-bg: #FFFFFF;
      --primary-color: #D84315;
      --price-color: #E65100;
      --text-main: #111111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: "Kantumruy Pro", sans-serif;
      padding: 16px 12px 140px 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-title {
      font-family: 'Moulpali', cursive, sans-serif;
      font-size: 34px;
      color: #111;
    }

    .brand-subtitle {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-color);
    }

    .section-title {
      font-size: 22px;
      font-weight: 900;
      margin: 24px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 3px solid #111;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .img-box {
      width: 100%;
      height: 320px; /* ធំវែងច្បាស់ */
      background: #EFEBE0;
      position: relative;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 12px;
    }

    .flavour-name {
      font-size: 19px;
      font-weight: 900;
      margin: 4px 0;
    }

    .product-price {
      font-size: 20px;
      font-weight: 900;
      color: var(--price-color);
      margin-bottom: 8px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F4F0E6;
      border-radius: 10px;
      padding: 2px 4px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: #FFFFFF;
      font-size: 16px;
      font-weight: 900;
      border-radius: 6px;
      cursor: pointer;
    }

    .qty-num { font-size: 16px; font-weight: 900; }

    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 12px; right: 12px;
      max-width: 476px;
      margin: 0 auto;
      background: #111;
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .cart-price { font-size: 22px; font-weight: 900; color: #FFB74D; }

    .btn-checkout {
      background: linear-gradient(135deg, #FF8C00, #E65100);
      color: #FFF;
      border: none;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      font-family: "Kantumruy Pro", sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">ម៉ូម៉័រ MOMORE</div>
    <div class="brand-subtitle">ហាងទំនិញលក់រាយ (Retail Shop)</div>
  </header>

  <div class="section-title">🍌 ដំណាប់ចេកខ្មែរ (200g)</div>
  <div class="product-grid">
    <div class="product-card">
      <div class="img-box"><img src="d-orig200.jpg" onerror="this.src='https://via.placeholder.com/400x600/F0ECE1/1A1A1A?text=Banana+200g'"></div>
      <div class="card-info">
        <div class="flavour-name">រសជាតិដើម</div>
        <div class="product-price">$2.50</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty('r-orig200', -1)">-</button>
          <span class="qty-num" id="qty-r-orig200">0</span>
          <button class="qty-btn" onclick="updateQty('r-orig200', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="product-card">
      <div class="img-box"><img src="d-sesm200.jpg" onerror="this.src='https://via.placeholder.com/400x600/F0ECE1/1A1A1A?text=Sesame+200g'"></div>
      <div class="card-info">
        <div class="flavour-name">រោយល្ង ស/ខ្មៅ</div>
        <div class="product-price">$2.75</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="updateQty('r-sesm200', -1)">-</button>
          <span class="qty-num" id="qty-r-sesm200">0</span>
          <button class="qty-btn" onclick="updateQty('r-sesm200', 1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-bar">
    <div>
      <div style="font-size: 12px; color: #AAA;">សរុបទំនិញលក់រាយ</div>
      <div class="cart-price" id="total-qty">0 កញ្ចប់</div>
    </div>
    <button class="btn-checkout" onclick="alert('បានរក្សាទុកការទិញ!')">ទិញឥឡូវនេះ</button>
  </div>

  <script>
    const cart = {};
    function updateQty(id, change) {
      if (!cart[id]) cart[id] = 0;
      cart[id] += change;
      if (cart[id] < 0) cart[id] = 0;
      document.getElementById('qty-' + id).innerText = cart[id];
      
      let total = 0;
      for (let k in cart) total += cart[k];
      document.getElementById('total-qty').innerText = total + ' កញ្ចប់';
    }
  </script>
</body>
</html>
