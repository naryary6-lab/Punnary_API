    // UI View Controllers
    function openCategory(catId) {
      currentCategory = catId;
      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('menu-view').classList.remove('hidden');
      document.getElementById('menu-title').innerText = catTitles[catId];
      renderProducts(catId);
    }

    function closeCategory() {
      currentCategory = null;
      document.getElementById('menu-view').classList.add('hidden');
      document.getElementById('home-view').classList.remove('hidden');
    }

    // Render Products grouped by Sub-Category
    function renderProducts(catId) {
      const listEl = document.getElementById('product-list');
      listEl.innerHTML = "";

      // Group products by their 'group' attribute
      let groupedProducts = {};
      for (let key in products) {
        if (products[key].cat === catId) {
          let p = products[key];
          let groupName = p.group || 'ផលិតផលផ្សេងៗ';
          if (!groupedProducts[groupName]) {
            groupedProducts[groupName] = [];
          }
          groupedProducts[groupName].push({ key: key, ...p });
        }
      }

      // Render each group
      for (let groupName in groupedProducts) {
        // Group Title
        listEl.innerHTML += `
          <h3 class="text-base font-bold text-banana-green mt-5 mb-3 pb-1 border-b-2 border-banana-yellow">
            ${groupName}
          </h3>
        `;

        // Products in this group
        groupedProducts[groupName].forEach(p => {
          let qty = cart[p.key] || 0;
          listEl.innerHTML += `
            <div class="bg-white rounded-xl mb-4 shadow-sm border border-gray-100 border-l-4 border-l-banana-green flex overflow-hidden h-32 active:bg-gray-50 transition-colors" onclick="openProductModal('${p.key}')">
              
              <!-- Image Container -->
              <div class="w-32 flex-shrink-0 bg-gray-50 relative cursor-pointer border-r border-gray-100">
                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover absolute inset-0" loading="lazy">
                <div class="absolute bottom-1 right-1 bg-black/50 text-white rounded-full p-1 w-6 h-6 flex items-center justify-center text-xs shadow-sm">🔎</div>
              </div>
              
              <!-- Content -->
              <div class="p-3 flex-grow flex flex-col justify-between cursor-pointer">
                <div>
                  <div class="text-[14px] leading-tight font-bold text-banana-green mb-1 line-clamp-2">${p.name}</div>
                </div>
                
                <div class="flex justify-between items-end mt-1">
                  <div class="font-bold text-red-600 text-[13px]">${p.price.toLocaleString()} ៛</div>
                  
                  <!-- Quantity Controls -->
                  <div class="flex items-center gap-2 bg-gray-50 rounded-lg p-1 border border-gray-200" onclick="event.stopPropagation()">
                    <button onclick="changeQty('${p.key}', -1)" class="w-7 h-7 flex justify-center items-center bg-white text-banana-green rounded shadow-sm border border-gray-200 active:bg-gray-200 text-lg font-bold leading-none">−</button>
                    <span id="qty-${p.key}" class="font-bold text-[14px] min-w-[20px] text-center text-gray-800">${qty}</span>
                    <button onclick="changeQty('${p.key}', 1)" class="w-7 h-7 flex justify-center items-center bg-banana-green text-white rounded shadow-sm active:bg-green-700 text-lg font-bold leading-none">+</button>
                  </div>
                </div>
              </div>

            </div>
          `;
        });
      }
    }

    // Modal Logic
    function openProductModal(key) {
      let p = products[key];
      document.getElementById('detail-img').src = p.image;
      document.getElementById('detail-title').innerText = p.name;
      document.getElementById('detail-price').innerText = p.price.toLocaleString() + ' ៛';
      document.getElementById('detail-desc').innerText = p.desc;
      document.getElementById('product-modal').style.display = 'flex';
    }

    function closeProductModal() {
      document.getElementById('product-modal').style.display = 'none';
    }

    function showCustomAlert(msg) {
      document.getElementById('alert-message').innerText = msg;
      document.getElementById('custom-alert').style.display = 'flex';
    }
    function closeAlert() { document.getElementById('custom-alert').style.display = 'none'; }

    // Cart Logic
    function changeQty(id, delta) {
      let currentQty = cart[id] || 0;
      currentQty += delta;
      if (currentQty < 0) currentQty = 0;
      cart[id] = currentQty;
      
      let qtySpan = document.getElementById(`qty-${id}`);
      if (qtySpan) qtySpan.innerText = currentQty;
      
      updateTotals();
    }

    // Advanced Shipping Logic
    function calculateTotals() {
      let totalItemPrice = 0;
      let counts = { db_box: 0, db_1kg: 0, bc_200g: 0, bc_100g: 0 };

      for (let key in cart) {
        let qty = cart[key];
        if (qty > 0) {
          let p = products[key];
          totalItemPrice += p.price * qty;
          if (p.shipCat !== 'none') {
            counts[p.shipCat] = (counts[p.shipCat] || 0) + qty;
          }
        }
      }

      let shippingFee = 8000;
      let isFreeShipping = false;

      if (totalItemPrice === 0) {
        shippingFee = 0;
      } else if (counts.db_box >= 5 || counts.db_1kg >= 1 || counts.bc_200g >= 5 || counts.bc_100g >= 10) {
        shippingFee = 0;
        isFreeShipping = true;
      }

      let grandTotal = totalItemPrice + shippingFee;
      return { totalItemPrice, shippingFee, grandTotal, isFreeShipping };
    }

    function updateTotals() {
      let calc = calculateTotals();
      document.getElementById('grand-total').innerText = calc.grandTotal.toLocaleString();
    }

    // Checkout Flow
    function openCheckoutModal() {
      let calc = calculateTotals();
      if (calc.totalItemPrice === 0) {
        showCustomAlert("សូមជ្រើសរើសទំនិញយ៉ាងហោចណាស់ ១ មុខសិន!");
        return;
      }
      
      let shipText = calc.isFreeShipping 
        ? '<span class="text-green-600 font-bold">Free (ឥតគិតថ្លៃ)</span>' 
        : calc.shippingFee.toLocaleString() + ' ៛';

      document.getElementById('modal-summary').innerHTML = `
        <div class="flex justify-between mb-1">
          <span>📦 តម្លៃទំនិញ:</span> <b>${calc.totalItemPrice.toLocaleString()} ៛</b>
        </div>
        <div class="flex justify-between mb-2">
          <span>🚚 សេវាដឹកជញ្ជូន:</span> <b>${shipText}</b>
        </div>
        <div class="flex justify-between border-t border-banana-green pt-2 mt-2 text-base">
          <span>💰 <b>ទឹកប្រាក់ត្រូវបង់:</b></span> <b class="text-red-600">${calc.grandTotal.toLocaleString()} ៛</b>
        </div>
      `;
      
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    function submitOrder() {
      const phone = document.getElementById('cust-phone').value.trim();
      const province = document.getElementById('cust-province').value.trim();
      const branch = document.getElementById('cust-branch').value.trim();

      if (!phone || !province || !branch) {
        showCustomAlert("សូមបំពេញ លេខទូរសព្ទ ខេត្ត និងសាខាដឹកជញ្ជូន ឱ្យបានគ្រប់គ្រាន់!");
        return;
      }

      let calc = calculateTotals();

      let orderText = "🛍️ ══════════════════ 🛍️\n";
      orderText += "          📥 **សំណើកុម្ម៉ង់ទំនិញ (MoMore)**\n";
      orderText += "🛍️ ══════════════════ 🛍️\n\n";

      orderText += "📋 **បញ្ជីទំនិញដែលបានជ្រើសរើស៖**\n";
      for (let key in cart) {
        if (cart[key] > 0) {
          let p = products[key];
          orderText += `▪️ ${p.name}\n`;
          orderText += `   👉 ចំនួន: ${cart[key]} | ទឹកប្រាក់: ${(cart[key] * p.price).toLocaleString()} ៛\n`;
        }
      }

      orderText += `\n📦 តម្លៃទំនិញ: ${calc.totalItemPrice.toLocaleString()} ៛\n`;
      orderText += `🚚 សេវាដឹកជញ្ជូន: ${calc.isFreeShipping ? 'Free' : calc.shippingFee.toLocaleString() + ' ៛'}\n`;
      orderText += `💰 **សរុបទឹកប្រាក់ត្រូវបង់:** ${calc.grandTotal.toLocaleString()} ៛\n`;
      orderText += "──────────────────────\n";
      orderText += "👤 **ព័ត៌មានអតិថិជន៖**\n";
      orderText += `📞 លេខទូរស័ព្ទ: ${phone}\n`;
      orderText += `📍 ខេត្ត/ក្រុង: ${province}\n`;
      orderText += `🏢 សាខា/ទីតាំង: ${branch}\n`;
      orderText += "──────────────────────\n";

      const encodedText = encodeURIComponent(orderText);
      const adminUsername = "MoMore_collection"; 
      
      window.open(`https://t.me/${adminUsername}?text=${encodedText}`, '_blank');
      closeCheckoutModal();
    }
  </script>
